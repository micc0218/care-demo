<!DOCTYPE html>
<html lang="zh-Hant" data-role="elder">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARE 青銀共創平台雛形</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  /* 日曆: the home screen is today's page of a Taiwanese tear-off calendar. A green
     band, a big red date, heavy black type, and 「宜」 naming the one thing to do today.
     Flat colour, no gradients. Sizes are in rem so the 樂齡版 scales everything by 125%.
     Light ground and dark text follow the project's design principles for older users. */
  --ground:#F1F2EE;
  --paper:#FFFFFF;
  --ink:#17191A;
  --ink-2:#565A5C;
  --line:#D4D7D1;
  --red:#D6311F;          /* 朱紅: the date, the main button, the stamps */
  --red-deep:#A62415;
  --green:#0B6B4A;        /* 日曆綠: the calendar band, quiet confirmations */
  --green-soft:#E1EEE7;
  --yellow:#FFC93C;       /* 螢光筆黃: whatever is selected */
  --yellow-soft:#FFF2C6;
  --blue:#2B50AA;
  --c:var(--green); --a:var(--red); --r:var(--blue); --e:#B36B00;   /* CARE stage colours */
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
  --font-num:"Abril Fatface","Noto Serif TC",Georgia,serif;
  --font-seal:"Noto Serif TC","PMingLiU","Noto Serif CJK TC",serif;
  --font-story:"LXGW WenKai TC","BiauKai","DFKai-SB","Noto Sans TC","Noto Sans CJK TC",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{font-size:100%}
html[data-role="elder"]{font-size:125%}
body{background:var(--ground);color:var(--ink);font-family:var(--font-body);line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
h1{font-size:1.7rem;font-weight:900;line-height:1.25;text-wrap:balance}
h2{font-size:1.15rem;font-weight:900;line-height:1.4}
h3{font-size:1rem;font-weight:700}
a{color:inherit}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ---------- shell: full-bleed ---------- */
.app{height:100%;background:var(--ground);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "tabs";position:relative;overflow:hidden}
.top{grid-area:top;background:var(--paper);border-bottom:2px solid var(--ink);padding:.5rem 1rem;display:flex;align-items:center;gap:.6rem}
.seal{width:2.3rem;height:2.3rem;flex:none;border-radius:6px;background:var(--red);color:#fff;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:.2rem;font-family:var(--font-seal);font-weight:900;font-size:.8rem;line-height:1}
.brand{font-family:var(--font-num);font-size:1.5rem;line-height:1;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-family:var(--font-body);font-weight:700;font-size:.62rem;letter-spacing:0;margin-top:.2rem;color:var(--ink-2)}
.seg{margin-left:auto;display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--paper);color:var(--ink);padding:.3rem .75rem;font-weight:700;font-size:.82rem;cursor:pointer;min-height:2.2rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

main{grid-area:main;min-height:0;overflow-y:auto;padding:1rem 1rem 5.6rem}
main.fit{padding:.8rem}
.page{width:100%;max-width:56rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.page.wide{max-width:var(--page-wide,56rem)}
.page.fit{max-width:none;min-height:100%}
.page>*{flex:none}
.cols{display:grid;grid-template-columns:var(--cols,minmax(0,1fr));gap:1rem;align-items:start}
.col{display:flex;flex-direction:column;gap:1rem;min-width:0}
.col.stick{position:var(--stick,static);top:.5rem}
.sheet-body>.cols{width:100%;max-width:var(--page-wide,56rem);margin:0 auto}

.tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:2px solid var(--ink)}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.55rem .1rem;font-size:.74rem;font-weight:700;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--red)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:-2px;left:20%;right:20%;height:5px;background:var(--red)}
.icon{width:1.4em;height:1.4em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs .icon{width:1.6rem;height:1.6rem}
.tabs .tick{position:absolute;top:.35rem;left:calc(50% + .4rem);width:1.05rem;height:1.05rem;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:2px solid var(--paper);box-sizing:content-box}
.tabs .tick .icon{width:.65rem;height:.65rem;stroke-width:4}

.fab{position:absolute;right:.8rem;bottom:4.9rem;z-index:10;display:inline-flex;align-items:center;gap:.4rem;border:2px solid var(--ink);border-radius:999px;background:var(--yellow);color:var(--ink);font-weight:900;font-size:.95rem;padding:.5rem 1rem .5rem .85rem;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.fab:active{transform:translateY(4px);box-shadow:none}

/* ---------- basics ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--ink-2);font-size:.88rem}
.tag{display:inline-block;align-self:flex-start;font-size:.74rem;font-weight:700;color:var(--ink);border-radius:4px;padding:.05rem .5rem;background:var(--yellow-soft)}
.head{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:center}
.head .letter{width:3.2rem;height:3.2rem;font-size:2rem}
.head.plain{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem}
.stage-name{font-size:.8rem;font-weight:700;color:var(--ink-2);line-height:1.3}
.letter{width:2.7rem;height:2.7rem;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--stage);font-family:var(--font-num);font-weight:400;font-size:1.6rem;line-height:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.55rem 1.2rem;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:900;font-size:1rem;cursor:pointer;text-decoration:none;text-align:center;line-height:1.3}
.btn.accent{background:var(--red);border-color:var(--red);box-shadow:0 4px 0 var(--red-deep)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{min-height:2.5rem;font-size:.9rem;padding:.35rem .8rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.accent:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;min-height:2.6rem;padding:.35rem .9rem;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:.95rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--yellow);border-color:var(--ink)}
.chip .icon{width:1.1em;height:1.1em;display:none;stroke-width:3}
.chip[aria-pressed="true"] .icon{display:block}
.kw{display:inline-block;font-size:.82rem;font-weight:700;background:var(--yellow-soft);border-radius:4px;padding:.1rem .5rem}

.steps{display:flex;flex-direction:column;gap:.5rem}
.steps a{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.75rem;text-decoration:none;padding:.55rem .7rem;border-radius:12px;border:2px solid var(--line);background:var(--paper)}
.steps a.cur{border-color:var(--ink)}
.st-t b{display:block;line-height:1.3;font-size:1.05rem}
.st-t small{display:block;color:var(--ink-2);font-size:.82rem;line-height:1.4}
.ok{display:inline-flex;align-items:center;gap:.25rem;color:var(--green);font-weight:700;font-size:.9rem}
.ok .icon{width:1.1em;height:1.1em;stroke-width:3}
.nowtag{font-size:.8rem;font-weight:700;background:var(--yellow);border-radius:4px;padding:.1rem .5rem;white-space:nowrap}
.count{font-size:.85rem;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.meter{height:.6rem;background:var(--line);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);background:var(--red);border-radius:999px}
.stamp{flex:none;display:inline-grid;place-items:center;width:3rem;height:3rem;border-radius:50%;border:2px solid var(--red);outline:1px solid var(--red);outline-offset:2px;color:var(--red);font-family:var(--font-seal);font-weight:900;font-size:.92rem;line-height:1;transform:rotate(-12deg);margin:.2rem}
.stamp.big{width:4.6rem;height:4.6rem;font-size:1.4rem;border-width:3px}
.stamp.in{animation:thunk .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes thunk{0%{opacity:0;transform:rotate(-12deg) scale(2.4)}55%{opacity:1}100%{opacity:1;transform:rotate(-12deg) scale(1)}}

.tip{border-left:5px solid var(--green);background:var(--green-soft);border-radius:0 10px 10px 0;padding:.6rem .85rem;font-size:.92rem}
.tip b{color:var(--green)}
html[data-role="elder"] .y-only{display:none!important}
html[data-role="youth"] .e-only{display:none!important}

/* ---------- home: today's calendar page ---------- */
.home{display:grid;grid-template-columns:var(--cols,minmax(0,1fr));gap:1rem;align-items:start}
.page.fit>.home{flex:1 0 auto;align-items:stretch;grid-template-rows:var(--home-rows,minmax(min-content,1fr) auto)}
.cal{background:var(--paper);border:2px solid var(--ink);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 0 var(--ink);margin-bottom:6px}
.cal-band{background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.4rem 1rem;font-weight:700}
.cal-date{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:1rem;padding:.7rem 1rem .5rem}
.cal-num{font-family:var(--font-num);font-size:clamp(4rem,15vh,6.6rem);line-height:.9;color:var(--red)}
.cal-hello{font-size:clamp(1.4rem,4.4vh,2rem)}
.cal-hello small{display:block;font-size:.85rem;font-weight:500;color:var(--ink-2);margin-top:.25rem;line-height:1.4}
.cal-do{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.7rem;padding:.8rem 1rem 1rem;border-top:2px dashed var(--ink)}
.cal-yi{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:center}
.yi{width:3.5rem;height:3.5rem;border-radius:50%;border:3px solid var(--red);color:var(--red);display:grid;place-items:center;font-family:var(--font-seal);font-weight:900;font-size:1.9rem;line-height:1}
.cal-yi h2{font-size:clamp(1.5rem,4.8vh,2.2rem);line-height:1.2}
.cal-yi p{color:var(--ink-2)}
.dots{display:flex;align-items:center;gap:.4rem;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.dots i{width:.8rem;height:.8rem;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.dots i.cur{background:var(--red);border-color:var(--red)}
.dots span{margin-left:.3rem}
.btn.go{min-height:3.7rem;font-size:1.25rem}
.btn.go .icon{animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,72%,100%{transform:translateX(0)}82%{transform:translateX(6px)}}
.enter .cal{transform-origin:top center;animation:flip .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{0%{opacity:0;transform:perspective(900px) rotateX(-70deg)}100%{opacity:1;transform:perspective(900px) rotateX(0)}}
.home-side{display:flex;flex-direction:column;gap:.8rem;min-width:0;min-height:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.quick .btn{padding-inline:.5rem}
.page.fit .steps-card{display:var(--side-steps,none);flex:1;min-height:0}
.page.fit .steps{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(min-content,1fr);gap:.6rem}
.page.fit .steps li{display:flex;min-width:0}
.page.fit .steps a{flex:1;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;align-items:start;gap:.5rem .6rem;padding:.7rem .8rem}
.page.fit .steps .letter{grid-area:1/1}
.page.fit .steps .st-t{grid-area:2/1/3/3;align-self:end}
.page.fit .steps a>:last-child{grid-area:1/2;justify-self:end}
.page.fit .steps .stamp{margin:0}

.person{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:start}
.person .info{display:flex;flex-direction:column;gap:.45rem;min-width:0}
.avatar{width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.25rem;color:#fff;background:var(--blue);flex:none}
.avatar.elder{background:var(--green)}
.avatar.sm{width:2.1rem;height:2.1rem;font-size:.9rem}
.pair{display:flex;align-items:center;justify-content:center;gap:.8rem;font-weight:900;font-size:1.1rem}
.pair .x{color:var(--ink-2);font-weight:500}
.who{display:flex;flex-direction:column;align-items:center;gap:.25rem}
.opts{display:flex;flex-direction:column;gap:.5rem}

/* ---------- photos ---------- */
.photo{border-radius:3px;overflow:hidden;background:#DDD8CC;aspect-ratio:4/3;border:.45rem solid #fff;box-shadow:0 0 0 1px var(--line),0 6px 14px rgba(23,25,26,.14)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.side{max-width:var(--side-photo,14rem);transform:rotate(-1.5deg);margin:.3rem .2rem}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.thumbs button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:.3rem;cursor:pointer;display:flex;flex-direction:column;gap:.2rem;font-weight:700;font-size:.85rem;align-items:center}
.thumbs button[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow)}
.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block}
.stepbar{display:flex;flex-direction:column;gap:.35rem}
.stepbar .row b{font-size:1.05rem}

.bubble{padding:.7rem .95rem;border-radius:14px;max-width:92%}
.bubble.q{background:var(--yellow-soft);border-bottom-left-radius:2px;font-weight:700;align-self:flex-start}
.bubble.q.big{font-size:1.15rem;line-height:1.5}
.bubble.a{background:var(--paper);border:1px solid var(--line);border-bottom-right-radius:2px;align-self:flex-end}
.bubble.wait{display:inline-flex;gap:.5rem;align-items:center;color:var(--ink-2)}
.talk{display:flex;flex-direction:column;gap:.5rem}
.lbl{font-weight:700;font-size:.95rem}
.field{width:100%;font-size:1rem;padding:.65rem .8rem;border:2px solid var(--line);border-radius:10px;background:var(--paper);resize:vertical;line-height:1.6}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--yellow);outline:none}
.story{font-family:var(--font-story);font-size:1.15rem;line-height:1.9}
p.story{white-space:pre-wrap}
.mic{display:none}
body.has-dict .mic{display:inline-flex}
body.has-dict .nodict{display:none}
.mic.on{background:var(--red);border-color:var(--red);color:#fff}
.spk{display:none}
body.has-tts .spk{display:inline-flex}
.ai-only{display:none}
body.has-ai .ai-only{display:flex;flex-direction:column;gap:.6rem}

.cmp{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:#DDD8CC;--pos:50%}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cmp .old{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--pos);width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 1px rgba(23,25,26,.4)}
.cmp.fade .old{clip-path:none;opacity:calc(var(--n) / 100)}
.cmp.fade .bar{display:none}
.cmp span{position:absolute;bottom:.5rem;font-size:.78rem;font-weight:700;background:var(--ink);color:#fff;border-radius:4px;padding:.05rem .5rem}
.cmp .l{left:.5rem}.cmp .r{right:.5rem}
input[type="range"]{width:100%;height:2.4rem;accent-color:var(--red)}
.cmpwrap{display:flex;flex-direction:column;gap:.4rem}

.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.moods button{display:flex;flex-direction:column;align-items:center;gap:.2rem;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:.6rem .2rem;font-weight:700;cursor:pointer}
.moods .icon{width:2.2rem;height:2.2rem}
.moods button[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow)}
.entry{display:grid;grid-template-columns:auto 1fr;gap:.7rem;padding:.7rem 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0;padding-top:0}
.entry .meta{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;font-size:.85rem;color:var(--ink-2)}
.entry .meta b{color:var(--ink);font-size:.95rem}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr));gap:.6rem}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.2rem;font-size:.78rem;color:var(--ink-2);line-height:1.35}
.badge .medal{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);color:var(--line);margin:.2rem}
.badge b{font-size:.88rem;color:var(--ink-2)}
.badge.got .medal{border:2px solid var(--red);outline:1px solid var(--red);outline-offset:2px;color:var(--red);transform:rotate(-8deg)}
.badge.got b{color:var(--ink)}
.work{display:grid;grid-template-columns:6.2rem 1fr;gap:.8rem;align-items:center;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:.6rem;cursor:pointer;width:100%}
.work img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block}
.work .w-t{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.work b{font-size:1.02rem;line-height:1.35}
.stat{display:inline-flex;align-items:center;gap:.25rem;font-size:.82rem;color:var(--ink-2);font-weight:700}
.stat .icon{width:1.05em;height:1.05em}
.list{display:flex;flex-direction:column;gap:.6rem}
.list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr))}

/* ---------- sheets ---------- */
.sheet{position:absolute;inset:0;z-index:20;background:var(--ground);display:flex;justify-content:center}
.panel{display:flex;flex-direction:column;width:100%;height:100%;min-width:0;background:var(--ground)}
.sheet[hidden]{display:none}
.sheet-top{flex:none;display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;background:var(--paper);border-bottom:2px solid var(--ink)}
.sheet-top h2{flex:1;min-width:0}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
.sheet-body>*{flex:none}
.sheet-foot{flex:none;padding:.7rem .8rem;background:var(--paper);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.5rem}
.send{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:end}
.present .story{font-size:1.5rem}
.present h1{font-size:2rem}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.tile{border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;background:var(--paper)}
.tile b{display:block;font-family:var(--font-num);font-weight:400;font-size:2rem;line-height:1.15;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--ink-2)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--ink-2);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td:first-child{white-space:nowrap;font-weight:700}
.state{display:inline-flex;align-items:center;gap:.3rem;font-weight:700;font-size:.85rem}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--line)}
.dot.on{background:var(--green)}
.foot{text-align:center;font-size:.85rem}
.toast{position:absolute;left:50%;transform:translateX(-50%);width:calc(100% - 2rem);max-width:28rem;top:4.2rem;z-index:40;background:var(--ink);color:#fff;padding:.7rem 1rem;border-radius:10px;text-align:center;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.party{position:relative;overflow:hidden}
.party .stamp{position:absolute;right:.8rem;top:.6rem}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-1rem;left:calc(var(--i) * 8.3%);width:.5rem;height:.85rem;border-radius:1px;background:var(--k);opacity:0;animation:fall 1.8s ease-out calc(var(--i) * 70ms) 1 forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(16rem) rotate(540deg)}}

@media (hover:hover){
  .btn:hover:not(:disabled){filter:brightness(1.15)}
  .btn.ghost:hover:not(:disabled){filter:none;background:var(--yellow-soft)}
  .chip:hover,.thumbs button:hover,.moods button:hover,.work:hover,.steps a:hover{border-color:var(--ink)}
  .tabs a:hover{color:var(--ink)}
}
/* Responsive. One column on phones and upright tablets. Two columns from 860px in the
   青年版 and from 1100px in the 樂齡版, whose type is 125% larger. */
@media (min-width:860px){
  html[data-role="youth"]{--cols:minmax(0,1.15fr) minmax(0,1fr);--page-wide:110rem;--stick:sticky;--side-photo:none}
  main{padding:1.5rem 1.5rem 5.6rem}
  main.fit{padding:1.2rem 1.5rem}
  .sheet{background:rgba(23,25,26,.6);padding:1.5rem;align-items:center}
  .panel{max-width:64rem;height:auto;max-height:100%;border-radius:14px;overflow:hidden;border:2px solid var(--ink)}
  .panel-help{max-width:27rem;height:100%;margin-left:auto}
  .panel-present{max-width:none;height:100%}
}
/* 樂齡版 home on a tall single-column screen: the calendar keeps its own height and
   the four steps fill the space under it. */
@media (min-height:900px) and (max-width:1099px){
  html[data-role="elder"]{--side-steps:flex;--home-rows:auto minmax(min-content,1fr)}
  .page.fit .cal-num{font-size:5rem}
  .page.fit .cal-do{gap:.55rem}
}
@media (min-width:1100px){
  html[data-role="elder"]{--cols:minmax(0,1.15fr) minmax(0,1fr);--page-wide:110rem;--stick:sticky;--side-photo:none;--side-steps:flex;--home-rows:minmax(min-content,1fr)}
}
/* Laptop: the tab bar becomes a side rail. */
@media (min-width:1024px){
  .app{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "tabs main"}
  .top{padding:.6rem 1.5rem}
  .tabs{display:flex;flex-direction:column;gap:.3rem;padding:1rem .8rem;border-top:0;border-right:2px solid var(--ink);min-width:11rem}
  .tabs a{flex-direction:row;justify-content:flex-start;gap:.7rem;padding:.75rem .9rem;font-size:1.05rem;border-radius:10px}
  .tabs a[aria-current="page"]{background:var(--yellow);color:var(--ink)}
  .tabs a[aria-current="page"]::before{display:none}
  .tabs .tick{position:static;margin-left:auto;border:0}
  .fab{bottom:1.2rem;right:1.4rem}
}
/* 樂齡版 home on a short screen: drop the secondary lines so the main button stays in view. */
@media (max-height:720px){
  .page.fit .st-t small{display:none}
}
@media (max-height:640px) and (max-width:859px){
  .page.fit .cal-num{font-size:3.4rem}

  .page.fit .cal-date{padding:.4rem 1rem .3rem}

}
@media (prefers-reduced-motion:reduce){
  .toast{transition:none}
  .enter .cal,.stamp.in,.btn.go .icon{animation:none}
  .confetti{display:none}
}

/* ---------- platform capabilities (AI, dictation, read-aloud) ---------- */
let sampleFn = null, sampleImages = false, tts = null, dict = null, dictState = 'idle', dictTarget = null, speaking = false, synthOK = false;
function cap(name){
  try { return (window.claude && typeof window.claude.use === 'function') ? window.claude.use(name).catch(() => null) : Promise.resolve(null); }
  catch (e) { return Promise.resolve(null); }
}
function refreshCaps(){
  document.body.classList.toggle('has-ai', !!sampleFn);
  document.body.classList.toggle('has-dict', !!dict);
  document.body.classList.toggle('has-tts', !!tts || synthOK);
  if (view() === 'research' && !ui.sheet) render();
}
cap('sample').then(s => {
  if (!s) return;
  sampleFn = s; refreshCaps();
  try { if (typeof s.limits === 'function') s.limits().then(l => { sampleImages = !!(l && l.images); }).catch(() => {}); } catch (e) {}
});
cap('dictation').then(d => {
  if (!d) return;
  dict = d;
  try {
    d.onPartial(({text}) => { if (dictTarget) dictTarget.el.value = dictTarget.base + text; });
    d.onFinal(({text}) => { if (dictTarget){ dictTarget.base += text; dictTarget.el.value = dictTarget.base; setPath(dictTarget.el.dataset.bind, dictTarget.base); save(); } });
    d.onState(({state}) => { dictState = state; if (state === 'idle') dictTarget = null; paintMic(); });
  } catch (e) {}
  refreshCaps();
});
cap('tts').then(t => {
  if (t){ tts = t; try { t.onState(({state}) => { speaking = state === 'speaking'; }); } catch (e) {} }
  else synthOK = ('speechSynthesis' in window) && typeof window.SpeechSynthesisUtterance !== 'undefined';
  refreshCaps();
});
function paintMic(){
  document.querySelectorAll('[data-act="mic"]').forEach(b => {
    const on = dictState === 'listening' && dictTarget && dictTarget.el.id === b.dataset.for;
    b.classList.toggle('on', !!on);
    const sp = b.querySelector('span'); if (sp) sp.textContent = on ? '說完了，按這裡' : '用說的';
  });
}
function speak(text){
  text = String(text || '').trim().slice(0, 1900);
  if (!text) return;
  if (tts){
    if (speaking){ try { tts.stop(); } catch (e) {} return; }
    tts.speak(text, {rate:S.role === 'elder' ? 0.9 : 1}).catch(e => {
      if (e && e.code === 'not_granted'){ tts = null; refreshCaps(); }
      else if (e && e.code === 'busy') toast('請先結束語音輸入，再按一次');
      else if (e && e.code === 'rate_limited') toast('朗讀太頻繁了，請等一下再試');
    });
    return;
  }
  if (!synthOK) return;
  try {
    if (speechSynthesis.speaking){ speechSynthesis.cancel(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW'; u.rate = S.role === 'elder' ? 0.85 : 1;
    let started = false; u.onstart = () => { started = true; };
    speechSynthesis.speak(u);
    setTimeout(() => { if (!started && !speechSynthesis.speaking){ synthOK = false; refreshCaps(); toast('這個瀏覽器不能朗讀，請改用電腦版 Chrome 開啟'); } }, 2500);
  } catch (e) { synthOK = false; refreshCaps(); }
}
async function askAI(prompt, opts){
  if (!sampleFn) return null;
  try {
    const r = await sampleFn(prompt, Object.assign({modelTier:'quick'}, opts || {}));
    return ((r && r.text) || '').trim() || null;
  } catch (e) {
    if (e && e.code === 'not_granted'){ sampleFn = null; refreshCaps(); }
    else if (e && e.code === 'rate_limited') toast('AI 現在比較忙，先用內建的題目');
    return null;
  }
}
function photoBlob(){
  const u = S.task.photo;
  if (!sampleImages || !/^data:image\/jpeg;base64,/.test(u)) return null;
  try { const bin = atob(u.split(',')[1]); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], {type:'image/jpeg'}); }
  catch (e) { return null; }
}

function parseStory(t){
  if (!t) return null;
  const g = k => { const m = t.match(new RegExp(k + '[：:]\\s*([\\s\\S]*?)(?=\\n\\s*(?:標題|故事|關鍵字|延伸提問)[：:]|$)')); return m ? m[1].trim() : ''; };
  const text = g('故事'); if (!text) return null;
  return {title:g('標題').replace(/[「」《》（）()]/g, '').slice(0, 20), text, keywords:g('關鍵字').split(/[、,，\s]+/).filter(Boolean).slice(0, 4), followup:g('延伸提問')};
}
function cleanSvg(t){
  if (!t) return '';
  const m = t.match(/<svg[\s\S]*<\/svg>/i); if (!m) return '';
  let s = m[0].replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, '').replace(/<image[\s\S]*?>/gi, '')
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi, '').replace(/(xlink:href|href)\s*=\s*("[^"#][^"]*"|'[^'#][^']*')/gi, '');
  if (!/xmlns=/.test(s)) s = s.replace(/<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
}

const TABS = [['home','home','首頁'], ['match','users','找學伴'], ['task','image','圓夢任務'], ['reflect','note','回顧'], ['wall','award','成果牆']];
let lastView = '', booted = false;
const seenDone = new Set();
function render(top){
  const v = view(), main = $('#main'), keep = (v === lastView && !top) ? main.scrollTop : 0;
  document.documentElement.dataset.role = S.role;
  $('#role-elder').setAttribute('aria-pressed', S.role === 'elder');
  $('#role-youth').setAttribute('aria-pressed', S.role === 'youth');
  const html = ({home:vHome, match:vMatch, task:vTask, reflect:vReflect, wall:vWall, research:vResearch})[v]();
  const fit = v === 'home' && S.role === 'elder';
  main.classList.toggle('fit', fit);
  main.innerHTML = `<div class="page${fit ? ' fit' : ''}${/class="cols|class="home"|data-wide/.test(html) ? ' wide' : ''}${v !== lastView ? ' enter' : ''}">${html}</div>`;
  main.scrollTop = keep; lastView = v;
  const doneNow = stages().filter(x => x.done);
  if (v === 'home') ui.unseen.clear();
  doneNow.forEach(x => { if (!seenDone.has(x.k)){ seenDone.add(x.k); if (v !== 'home' && booted) ui.unseen.add(x.k); } });
  booted = true;
  const tick = Object.fromEntries(doneNow.map(x => [x.href.slice(1), 1]));
  $('#tabs').innerHTML = TABS.map(t => `<a href="#${t[0]}" ${v === t[0] ? 'aria-current="page"' : ''}>${ic(t[1])}${t[2]}${tick[t[0]] ? `<i class="tick" title="已完成">${ic('check')}</i>` : ''}</a>`).join('');
  const sheet = $('#sheet');
  if (ui.sheet){ sheet.hidden = false; sheet.innerHTML = `<div class="panel panel-${ui.sheet.type}">${sheetHtml()}</div>`; const cb = $('#chat-body'); if (cb) cb.scrollTop = cb.scrollHeight; }
  else { sheet.hidden = true; sheet.innerHTML = ''; }
  $('#fab').hidden = !!ui.sheet || fit;
  paintMic();
}
let toastTimer = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
function setPath(path, val){
  if (!path) return;
  const parts = path.split('.'); let o = parts[0] === 'ui' ? ui : S;
  for (let i = 1; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = val;
}
function stopDict(){ if (dict && dictState === 'listening'){ try { dict.stop().catch(() => {}); } catch (e) {} } }

/* ---------- actions ---------- */
async function nextQ(){
  const T = S.task, a = T.draft.trim();
  if (!a){ toast('請先說一點點，或打幾個字'); return; }
  stopDict();
  T.qa.push({q:T.q, a}); T.draft = ''; T.q = ''; log('answer');
  if (T.qa.length >= 4){ save(); render(); return; }
  busy = 'q'; render();
  const blob = photoBlob();
  let ai = await askAI(promptQ(!!blob), blob ? {images:[blob]} : {});
  if (!ai && blob) ai = await askAI(promptQ(false));
  if (ai){ ai = ai.replace(/^["「『]|["」』]$/g, '').split('\n')[0].trim().slice(0, 60); log('ai_q'); }
  T.q = ai || BANK[T.qa.length] || BANK[BANK.length - 1];
  busy = ''; save(); render();
}
async function compose(){
  const T = S.task;
  if (T.step === 2 && T.draft.trim()){ T.qa.push({q:T.q || '還想補充什麼？', a:T.draft.trim()}); T.draft = ''; log('answer'); }
  if (!T.qa.length) return;
  stopDict();
  busy = 'story'; render();
  const p = parseStory(await askAI(promptStory(), {modelTier:'default'}));
  T.title = (p && p.title) || S.topic;
  T.text = (p && p.text) || T.qa.map(x => x.a).join('');
  T.keywords = (p && p.keywords) || [];
  T.followup = (p && p.followup) || '';
  T.step = 3; busy = ''; log('story'); save(); render(true);
  if (!p && sampleFn === null) toast('目前沒有連上 AI，先把回答直接串成故事');
}
async function drawArt(){
  busy = 'art'; render();
  const uri = cleanSvg(await askAI(promptArt(), {modelTier:'default'}));
  busy = '';
  if (uri){ S.task.art = uri; log('art'); save(); } else toast('這次沒有畫成功，請再試一次');
  render();
}
async function sendChat(text){
  text = String(text || '').trim();
  if (!text || busy) return;
  stopDict();
  S.chat.push({me:true, text}); ui.chatDraft = ''; busy = 'chat'; log('chat'); render();
  const needHuman = /需要人幫忙/.test(text);
  const ans = (needHuman ? null : await askAI(promptChat(text), {cache:false})) || canned(text);
  S.chat.push({me:false, text:ans}); if (S.chat.length > 40) S.chat.splice(0, S.chat.length - 40);
  busy = ''; save(); render();
}
function readImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, 960 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const ACT = {
  role(el){ stopDict(); S.role = el.dataset.role; log('role'); save(); render(); },
  like(el){ const a = S.likes[S.role], id = el.dataset.id, i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else a.push(id); save(); render(); },
  mode(el){ S.mode[S.role] = el.dataset.mode; save(); render(); },
  pick(el){ S.me[other()] = el.dataset.id; S.paired = true; S.topic = ''; log('pair'); save(); render(true); toast('配對成功，接著選主題'); },
  topic(el){ S.topic = el.dataset.topic; log('topic'); save(); render(true); },
  rematch(){ S.paired = false; S.topic = ''; save(); render(true); },
  quick(){ S.paired = true; S.topic = TOPICS.photo; log('pair'); save(); render(true); },
  sample(el){ const T = S.task; T.sample = el.dataset.kind; T.photo = scene(T.sample, 'old'); T.now = ''; log('photo'); save(); render(); },
  tnext(){ const T = S.task; if (T.step === 3 && !T.text.trim()){ toast('故事內容還是空的'); return; } if (T.step === 4 && T.now) log('compare'); T.step = Math.min(5, T.step + 1); save(); render(true); },
  tback(){ stopDict(); S.task.step = Math.max(1, S.task.step - 1); save(); render(true); },
  nextq(){ nextQ(); },
  compose(){ compose(); },
  art(){ drawArt(); },
  artclear(){ S.task.art = ''; save(); render(); },
  nowsample(){ S.task.now = scene(S.task.sample, 'now'); save(); render(); },
  nowclear(){ S.task.now = ''; save(); render(); },
  publish(){
    const T = S.task;
    const w = {id:'w' + Date.now(), seed:false, title:T.title.trim() || S.topic, text:T.text.trim(), keywords:T.keywords, photo:T.photo, now:T.now, art:T.art, elder:S.me.elder, youth:S.me.youth, topic:S.topic, date:today(), likes:0, comments:[]};
    S.works.unshift(w); S.task = newTask(); ui.published = w.id; log('publish'); save(); render(true);
  },
  newtask(){ ui.published = ''; S.task = newTask(); save(); render(true); },
  mood(el){ ui.mood = el.dataset.m; render(); },
  reflect(){
    const text = ui.reflectText.trim();
    if (!ui.mood){ toast('請先選今天的心情'); return; }
    if (!text){ toast('請寫一兩句話，或用說的'); return; }
    stopDict();
    S.reflections.push({who:S.me[S.role], role:S.role, mood:ui.mood, text, date:today()});
    ui.reflectText = ''; ui.mood = ''; log('reflect'); save(); render(); toast('回顧已送出');
  },
  open(el){ ui.sheet = {type:'work', id:el.dataset.id}; ui.commentDraft = ''; ui.cmpPos = 50; ui.cmpMode = 'slide'; render(); },
  close(){ stopDict(); ui.sheet = null; render(); },
  present(el){ ui.sheet = {type:'present', id:el.dataset.id}; log('present'); save(); render(); },
  back2work(){ ui.sheet = {type:'work', id:ui.sheet.id}; render(); },
  likework(el){ const w = S.works.find(x => x.id === el.dataset.id); if (w){ w.likes++; log('like'); save(); render(); } },
  comment(el){
    const w = S.works.find(x => x.id === el.dataset.id), text = ui.commentDraft.trim();
    if (!w) return; if (!text){ toast('請先寫下想說的話'); return; }
    stopDict();
    w.comments.push({who:S.me[S.role], text}); ui.commentDraft = ''; log('comment'); save(); render(); toast('留言已送出');
  },
  help(){ ui.sheet = {type:'help'}; render(); },
  quickq(el){ sendChat(el.dataset.q); },
  chatsend(){ sendChat(ui.chatDraft); },
  speak(el){
    let text = el.dataset.text || '';
    if (el.dataset.from){ const f = document.getElementById(el.dataset.from); text = f ? f.value : ''; }
    if (el.dataset.work){ const w = S.works.find(x => x.id === el.dataset.work); text = w ? w.title + '。' + w.text : ''; }
    speak(text);
  },
  mic(el){
    if (!dict) return;
    if (dictState === 'listening'){ stopDict(); return; }
    const target = document.getElementById(el.dataset.for);
    if (!target) return;
    dictTarget = {el:target, base:target.value};
    dict.start().catch(e => {
      dictTarget = null; paintMic();
      if (e && e.code === 'not_granted'){ dict = null; refreshCaps(); toast('沒有開啟語音輸入，請改用打字'); }
    });
    log('voice');
  },
  checkin(){ S.checkin = true; log('checkin'); save(); render(); toast('報到成功'); },
  cmpmode(el){ ui.cmpMode = el.dataset.mode; render(); },
  copycsv(){
    const text = csv();
    const fail = () => { ui.csv = true; render(); };
    try { navigator.clipboard.writeText(text).then(() => toast('已複製，可以貼到 Excel'), fail); } catch (e) { fail(); }
  },
  reset(){ ui.confirmReset = true; render(); },
  resetno(){ ui.confirmReset = false; render(); },
  resetyes(){ S = fresh(); ui.unseen.clear(); seenDone.clear(); Object.assign(ui, {sheet:null, chatDraft:'', reflectText:'', mood:'', commentDraft:'', published:'', confirmReset:false, csv:false}); save(); go('home'); toast('已回到剛打開的樣子'); }
};

document.addEventListener('click', ev => {
  if (ev.target.id === 'sheet'){ ACT.close(); return; }
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.bind){ setPath(el.dataset.bind, el.value); if (el.dataset.bind.indexOf('S.') === 0) save(); }
  if (el.hasAttribute && el.hasAttribute('data-cmp')){
    ui.cmpPos = +el.value;
    const c = el.closest('.cmpwrap').querySelector('.cmp');
    c.style.setProperty('--pos', el.value + '%'); c.style.setProperty('--n', el.value);
  }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if (!el.dataset || !el.dataset.file || !el.files || !el.files[0]) return;
  try {
    const url = await readImage(el.files[0]);
    if (el.dataset.file === 'old'){ S.task.photo = url; S.task.sample = ''; S.task.now = ''; log('photo'); }
    else S.task.now = url;
    save(); render();
  } catch (e) { toast('這張照片打不開，請換一張 JPG 或 PNG'); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.sheet) ACT.close(); });
window.addEventListener('hashchange', () => { stopDict(); ui.sheet = null; if (view() !== 'task') ui.published = ''; render(true); });

render(true);
})();
